version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: outfit_advisor_db
    environment:
      POSTGRES_USER: outfit_user
      POSTGRES_PASSWORD: outfit_password
      POSTGRES_DB: outfit_advisor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outfit_user -d outfit_advisor_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: outfit_advisor_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://outfit_user:outfit_password@postgres:5432/outfit_advisor_db
      - JWT_SECRET_KEY=production-jwt-secret-key-outfit-style-advisor-2026
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: outfit_advisor_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
