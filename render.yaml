services:
  - type: web
    name: outfit-style-advisor-api
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: outfit-advisor-db
          property: connectionString

  - type: web
    name: outfit-style-advisor-web
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://outfit-style-advisor-api.onrender.com/api

databases:
  - name: outfit-advisor-db
    databaseName: outfit_advisor_db
    user: outfit_user
